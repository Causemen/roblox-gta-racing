name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install tools
        run: rokit install --no-trust-check

      - name: Install packages
        run: |
          mkdir -p Packages ServerPackages
          wally install

      - name: Format
        run: stylua --check src tests

      - name: Lint
        run: selene src

      - name: Build places
        run: |
          mkdir -p build
          rojo build hub.project.json -o build/hub.rbxl
          rojo build race.project.json -o build/race.rbxl
          rojo build autotest.project.json -o build/autotest.rbxl

      - name: Tests
        run: for f in tests/*.spec.luau; do lune run "$f"; done
